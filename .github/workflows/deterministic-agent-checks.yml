name: deterministic-agent-checks

on:
  push:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
    - cron: "0 4 * * 1"

jobs:
  deterministic-agent-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Check codex bridge config
        run: python scripts/check_codex_bridge_config.py

      - name: Check runtime skill accessibility
        run: python scripts/check_skill_runtime_access.py

      - name: Check OpenSpec ownership policy
        run: python scripts/check_ownership_policy.py

      - name: Run executable BDD gate tests
        run: pytest -q tests/backend/test_bdd_chat_flow.py

      - name: Run deterministic retrieval eval tests
        run: pytest -q evals/tests/test_retrieval_prompt_paths.py evals/tests/test_retrieval_prompt_paths_audit.py

      - name: Validate frozen paper_core benchmark plan
        run: python -m evals.runners.run_suite --suite paper_core --params-signature baseline --git-commit "${GITHUB_SHA}"

      - name: Validate frozen paper_full benchmark plan on nightly
        if: github.event_name == 'schedule' && github.event.schedule == '0 3 * * *'
        run: python -m evals.runners.run_suite --suite paper_full --params-signature baseline --git-commit "${GITHUB_SHA}"

      - name: Validate frozen paper_audit benchmark plan on weekly
        if: github.event_name == 'schedule' && github.event.schedule == '0 4 * * 1'
        run: python -m evals.runners.run_suite --suite paper_audit --params-signature baseline --git-commit "${GITHUB_SHA}"
